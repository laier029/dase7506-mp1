name: Apply documentation correction

on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply disclosure correction
        run: |
          test -f assistance_disclosure_update.zip
          unzip -o assistance_disclosure_update.zip
          rm -f assistance_disclosure_update.zip
          rm -f .github/workflows/apply-doc-correction.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clarify ownership of experiment design"
          git push
