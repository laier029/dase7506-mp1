name: Expand submission source

on:
  push:
    paths:
      - source_payload.zip

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand verified source payload
        shell: bash
        run: |
          set -euo pipefail
          unzip -q source_payload.zip
          rm source_payload.zip
          rm .github/workflows/expand-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish final submission source"
          git push
